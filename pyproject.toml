[project]
name = "zombiescan"
version = "0.1.0"
description = "Find the AWS resources nobody is using, and what they cost you."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.34",
    # The CRT extra is REQUIRED, not optional: boto3's `login` credential
    # provider (used by `aws login` sessions) raises MissingDependencyException
    # without it. See CLAUDE.md.
    "botocore[crt]>=1.34",
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/xbill9/zombiescan"
Repository = "https://github.com/xbill9/zombiescan"
Issues = "https://github.com/xbill9/zombiescan/issues"

[project.scripts]
zombiescan = "zombiescan.cli:main"
# The MCP server behind the Claude Code plugin. Same engine, same
# read-only guarantee; it speaks JSON-RPC over stdio instead of to a terminal.
zombiescan-mcp = "zombiescan.mcp_server:main"

[dependency-groups]
# ruff is pinned, not floated. It is a formatter as well as a linter, so a
# new release reformats files nobody edited and fails CI on a commit that
# did not touch them. Bump it deliberately, with the reformat in its own
# commit.
dev = ["pytest>=8.0", "ruff==0.16.8", "jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zombiescan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits a real AWS account; requires ZOMBIESCAN_LIVE=1"]
